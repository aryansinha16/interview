[project]
name = "optiflow-backend-python"
version = "1.2.0"
description = "OptiFlow Python backend — FastAPI, feature-first layout"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.3",
    "pydantic==2.13.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
